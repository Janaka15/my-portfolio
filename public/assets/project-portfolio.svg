<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E111A"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Ambient Glow Orbs -->
  <circle cx="300" cy="200" r="180" fill="#3B82F6" opacity="0.15" filter="url(#blurFilter)"/>
  <circle cx="900" cy="450" r="220" fill="#8B5CF6" opacity="0.15" filter="url(#blurFilter)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Browser Window Mockup -->
  <g transform="translate(100, 60)">
    <!-- Window Frame -->
    <rect width="1000" height="555" rx="16" fill="#121622" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Window Header -->
    <rect width="1000" height="48" rx="16" fill="#181D2C"/>
    <rect y="32" width="1000" height="16" fill="#181D2C"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="180" y="10" width="640" height="28" rx="8" fill="#0E121B" stroke="rgba(255,255,255,0.06)"/>
    <text x="500" y="28" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">https://kavindu-portfolio.dev</text>

    <!-- Page Content Preview -->
    <g transform="translate(50, 80)">
      <!-- Mini Nav -->
      <text x="0" y="20" fill="#3B82F6" font-family="Inter, sans-serif" font-weight="700" font-size="18">KH .</text>
      <rect x="750" y="6" width="150" height="26" rx="6" fill="url(#accentGlow)" opacity="0.8"/>
      <text x="825" y="23" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Let's Talk</text>

      <!-- Hero Headline Preview -->
      <text x="0" y="110" fill="#9CA3AF" font-family="Inter, sans-serif" font-weight="500" font-size="16">Hello, I'm Kavindu</text>
      <text x="0" y="160" fill="#F3F4F6" font-family="Inter, sans-serif" font-weight="800" font-size="38">Building <tspan fill="url(#accentGlow)">Digital Experiences</tspan></text>
      <text x="0" y="210" fill="#F3F4F6" font-family="Inter, sans-serif" font-weight="800" font-size="38">That Matter.</text>

      <!-- Mini Badges -->
      <rect x="0" y="250" width="130" height="34" rx="8" fill="url(#accentGlow)"/>
      <text x="65" y="272" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Explore Work</text>

      <rect x="145" y="250" width="130" height="34" rx="8" fill="#1E2333" stroke="rgba(255,255,255,0.1)"/>
      <text x="210" y="272" fill="#E2E8F0" font-family="Inter, sans-serif" font-weight="500" font-size="13" text-anchor="middle">Contact Me</text>

      <!-- Mini Cards Preview on Right -->
      <g transform="translate(540, 70)">
        <rect width="360" height="260" rx="16" fill="#161B29" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
        <circle cx="180" cy="100" r="50" fill="#20273B" stroke="url(#accentGlow)" stroke-width="2"/>
        <text x="180" y="106" fill="#3B82F6" font-family="Inter, sans-serif" font-weight="800" font-size="22" text-anchor="middle">&lt; / &gt;</text>
        <rect x="40" y="180" width="280" height="12" rx="4" fill="#2A324B"/>
        <rect x="70" y="204" width="220" height="10" rx="4" fill="#20273B"/>
        <rect x="110" y="226" width="140" height="8" rx="4" fill="#3B82F6" opacity="0.6"/>
      </g>
    </g>
  </g>
</svg>
