<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="taskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D13"/>
      <stop offset="100%" stop-color="#111520"/>
    </linearGradient>
    <linearGradient id="taskGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="taskBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#taskBg)"/>
  <circle cx="200" cy="500" r="160" fill="#3B82F6" opacity="0.12" filter="url(#taskBlur)"/>
  <circle cx="1000" cy="200" r="180" fill="#8B5CF6" opacity="0.12" filter="url(#taskBlur)"/>

  <!-- Application Window -->
  <g transform="translate(60, 45)">
    <rect width="1080" height="585" rx="16" fill="#121623" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- App Bar -->
    <rect width="1080" height="50" rx="16" fill="#161B2B"/>
    <rect y="35" width="1080" height="15" fill="#161B2B"/>
    <circle cx="30" cy="25" r="5" fill="#EF4444"/>
    <circle cx="48" cy="25" r="5" fill="#F59E0B"/>
    <circle cx="66" cy="25" r="5" fill="#10B981"/>

    <!-- App Title -->
    <text x="120" y="30" fill="#F3F4F6" font-family="Inter, sans-serif" font-weight="700" font-size="14">Sprint Board — Q4 Product Roadmap</text>
    <rect x="910" y="12" width="130" height="26" rx="6" fill="#3B82F6" opacity="0.9"/>
    <text x="975" y="29" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="600" font-size="11" text-anchor="middle">+ Add Task</text>

    <!-- Sidebar & Kanban Columns -->
    <g transform="translate(30, 75)">
      <!-- Sidebar mini -->
      <rect width="180" height="470" rx="12" fill="#161B2A" stroke="rgba(255,255,255,0.05)"/>
      <rect x="20" y="30" width="140" height="28" rx="6" fill="#20273D"/>
      <text x="40" y="48" fill="#38BDF8" font-family="Inter, sans-serif" font-weight="600" font-size="12">📋 All Tasks</text>
      
      <rect x="20" y="70" width="140" height="28" rx="6" fill="transparent"/>
      <text x="40" y="88" fill="#9CA3AF" font-family="Inter, sans-serif" font-weight="500" font-size="12">⚡ High Priority</text>

      <rect x="20" y="110" width="140" height="28" rx="6" fill="transparent"/>
      <text x="40" y="128" fill="#9CA3AF" font-family="Inter, sans-serif" font-weight="500" font-size="12">📊 Analytics</text>

      <!-- Column 1: To Do -->
      <g transform="translate(210, 0)">
        <rect width="250" height="470" rx="12" fill="#151927" stroke="rgba(255,255,255,0.04)"/>
        <text x="20" y="32" fill="#E2E8F0" font-family="Inter, sans-serif" font-weight="700" font-size="13">TO DO</text>
        <circle cx="215" cy="27" r="10" fill="#242C42"/>
        <text x="215" y="31" fill="#94A3B8" font-family="Inter, sans-serif" font-weight="600" font-size="11" text-anchor="middle">3</text>

        <!-- Card 1 -->
        <rect x="15" y="55" width="220" height="110" rx="10" fill="#1B2133" stroke="rgba(255,255,255,0.08)"/>
        <rect x="30" y="70" width="70" height="18" rx="4" fill="#3B82F6" opacity="0.2"/>
        <text x="65" y="83" fill="#60A5FA" font-family="Inter, sans-serif" font-weight="600" font-size="10" text-anchor="middle">RESEARCH</text>
        <text x="30" y="110" fill="#F1F5F9" font-family="Inter, sans-serif" font-weight="600" font-size="12">Refactor Auth State</text>
        <text x="30" y="130" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Implement JWT tokens</text>

        <!-- Card 2 -->
        <rect x="15" y="180" width="220" height="110" rx="10" fill="#1B2133" stroke="rgba(255,255,255,0.08)"/>
        <rect x="30" y="195" width="60" height="18" rx="4" fill="#EC4899" opacity="0.2"/>
        <text x="60" y="208" fill="#F472B6" font-family="Inter, sans-serif" font-weight="600" font-size="10" text-anchor="middle">DESIGN</text>
        <text x="30" y="235" fill="#F1F5F9" font-family="Inter, sans-serif" font-weight="600" font-size="12">Dark Mode Overhaul</text>
        <text x="30" y="255" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Review color contrast ratio</text>
      </g>

      <!-- Column 2: In Progress -->
      <g transform="translate(480, 0)">
        <rect width="250" height="470" rx="12" fill="#151927" stroke="rgba(255,255,255,0.04)"/>
        <text x="20" y="32" fill="#60A5FA" font-family="Inter, sans-serif" font-weight="700" font-size="13">IN PROGRESS</text>
        <circle cx="215" cy="27" r="10" fill="#242C42"/>
        <text x="215" y="31" fill="#60A5FA" font-family="Inter, sans-serif" font-weight="600" font-size="11" text-anchor="middle">2</text>

        <!-- Card in progress -->
        <rect x="15" y="55" width="220" height="125" rx="10" fill="#1C2338" stroke="rgba(59,130,246,0.4)" stroke-width="1.5"/>
        <rect x="30" y="70" width="80" height="18" rx="4" fill="#8B5CF6" opacity="0.2"/>
        <text x="70" y="83" fill="#A78BFA" font-family="Inter, sans-serif" font-weight="600" font-size="10" text-anchor="middle">DEV SPRINT</text>
        <text x="30" y="110" fill="#F8FAFC" font-family="Inter, sans-serif" font-weight="600" font-size="12">API Pagination Engine</text>
        <rect x="30" y="130" width="180" height="6" rx="3" fill="#2A344E"/>
        <rect x="30" y="130" width="130" height="6" rx="3" fill="#3B82F6"/>
        <text x="30" y="155" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">72% Completed</text>
      </g>

      <!-- Column 3: Completed -->
      <g transform="translate(750, 0)">
        <rect width="250" height="470" rx="12" fill="#151927" stroke="rgba(255,255,255,0.04)"/>
        <text x="20" y="32" fill="#34D399" font-family="Inter, sans-serif" font-weight="700" font-size="13">COMPLETED</text>
        <circle cx="215" cy="27" r="10" fill="#242C42"/>
        <text x="215" y="31" fill="#34D399" font-family="Inter, sans-serif" font-weight="600" font-size="11" text-anchor="middle">4</text>

        <!-- Card completed -->
        <rect x="15" y="55" width="220" height="100" rx="10" fill="#182030" stroke="rgba(16,185,129,0.3)"/>
        <rect x="30" y="70" width="60" height="18" rx="4" fill="#10B981" opacity="0.2"/>
        <text x="60" y="83" fill="#34D399" font-family="Inter, sans-serif" font-weight="600" font-size="10" text-anchor="middle">RELEASE</text>
        <text x="30" y="110" fill="#F1F5F9" font-family="Inter, sans-serif" font-weight="600" font-size="12">Deploy v1.2 Release</text>
        <text x="30" y="130" fill="#10B981" font-family="Inter, sans-serif" font-size="10">✓ Verified in Staging</text>
      </g>
    </g>
  </g>
</svg>
